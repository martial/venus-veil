<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030304" />
    <meta name="description" content="A translucent veil in wind, shaped by the depth map of a prehistoric Venus." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M5 28Q4 10 27 4Q15 15 5 28Z' fill='%23e8dcc8'/%3E%3C/svg%3E" />
    <title>Venus Veil</title>
    <style>
      :root { color-scheme: dark; --ink: #d9d3c8; --muted: #8b857a; --line: rgba(232, 220, 200, 0.14); }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #030304; color: var(--ink); font: 12px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; }
      #viewport { position: fixed; inset: 0; }
      #viewport canvas { display: block; width: 100%; height: 100%; }
      .chrome { position: fixed; z-index: 3; pointer-events: none; }
      #title { left: 28px; top: 24px; }
      #title h1 { margin: 0; font: 300 26px/1 Georgia, "Times New Roman", serif; letter-spacing: -0.5px; color: #eae2d4; }
      #title p { margin: 6px 0 0; color: var(--muted); font-size: 11px; letter-spacing: 0.4px; text-transform: uppercase; }
      #activity { margin-top: 12px; font-size: 11px; color: #b9ad97; font-variant-numeric: tabular-nums; pointer-events: auto; }
      #activity::before { content: "●"; color: #8daf91; margin-right: 6px; font-size: 8px; }
      #activity[data-status="offline"]::before { color: #8b857a; }
      #activity[data-status="loading"]::before { color: #d8c8a6; }
      #footer { left: 28px; right: 28px; bottom: 22px; display: flex; justify-content: space-between; align-items: flex-end; color: var(--muted); font-size: 11px; }
      #footer span i { font-style: normal; margin: 0 8px; opacity: 0.5; }
      #drop-hint { pointer-events: none; }
      #state::before { content: "●"; color: #c9b58a; margin-right: 6px; font-size: 9px; vertical-align: 1px; }
      #thumbs { left: 28px; bottom: 56px; display: flex; gap: 8px; pointer-events: auto; }
      #thumbs canvas { width: 72px; height: 72px; object-fit: cover; border: 1px solid var(--line); background: #0a0a0c; display: block; }
      #thumbs[hidden] { display: none; }
      #progress { left: 50%; top: 24px; transform: translateX(-50%); width: min(420px, 70vw); text-align: center; color: var(--muted); font-size: 11px; opacity: 0; transition: opacity 0.3s; }
      #progress.visible { opacity: 1; }
      #progress-track { height: 2px; background: rgba(255,255,255,0.08); margin-top: 8px; }
      #progress-bar { height: 100%; width: 0%; background: #d8c8a6; transition: width 0.15s; }
      #toast { left: 50%; bottom: 96px; transform: translate(-50%, 10px); background: rgba(20, 18, 16, 0.92); border: 1px solid var(--line); color: #e6dfd2; padding: 10px 16px; font-size: 12px; opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; max-width: 80vw; text-align: center; }
      #toast.visible { opacity: 1; transform: translate(-50%, 0); }
      #loading { position: fixed; inset: 0; z-index: 10; background: #030304; display: grid; place-items: center; transition: opacity 0.8s; pointer-events: none; }
      #loading.loaded { opacity: 0; }
      #loading span { font: 300 40px Georgia, serif; letter-spacing: -1px; color: #eae2d4; }
      #error { position: fixed; inset: 0; z-index: 20; background: #030304; padding: 15vh 10vw; }
      #error h1 { font: 300 32px Georgia, serif; }
      body.drag #drop-overlay { opacity: 1; }
      #drop-overlay { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0; transition: opacity 0.2s; border: 1px dashed rgba(232, 220, 200, 0.5); margin: 16px; display: grid; place-items: center; background: rgba(3, 3, 4, 0.5); font: 300 22px Georgia, serif; color: #eae2d4; }
      body.ui-hidden .chrome, body.ui-hidden .lil-gui { display: none !important; }
      .lil-gui { --background-color: rgba(10, 10, 12, 0.82) !important; --widget-color: rgba(255,255,255,0.06) !important; --hover-color: rgba(255,255,255,0.1) !important; --focus-color: rgba(255,255,255,0.14) !important; --number-color: #d8c8a6 !important; --string-color: #d8c8a6 !important; --text-color: #d9d3c8 !important; --title-background-color: rgba(20, 18, 16, 0.9) !important; --font-family: "Helvetica Neue", Helvetica, Arial, sans-serif !important; --font-size: 11px !important; --input-font-size: 11px !important; backdrop-filter: blur(10px); border: 1px solid rgba(232, 220, 200, 0.12); }
      .lil-gui.root { top: 16px !important; right: 16px !important; max-height: calc(100vh - 32px); overflow: auto; }
      input[type=file] { display: none; }
      .look-note { font-size: 10px; color: #8b857a; padding: 0 0 8px 12px; margin-top: -4px; line-height: 1.4; }
      #projector-panel { left: 28px; bottom: 148px; width: 244px; }
      #projector-panel[hidden] { display: none; }
      #projector-panel .pp-row { display: flex; gap: 8px; }
      #projector-panel figure { margin: 0; }
      #projector-panel .pp-row canvas { width: 118px; height: 118px; display: block; border: 1px solid var(--line); background: #060607; }
      #projector-panel figcaption { font-size: 10px; color: var(--muted); margin-top: 4px; letter-spacing: 0.3px; }
      #pp-guide { display: block; margin-top: 10px; pointer-events: auto; }
      #pp-guide span { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); letter-spacing: 0.3px; margin-bottom: 4px; }
      #pp-guide span b { font-weight: normal; color: #8daf91; }
      #pp-guide span b.pending { color: #d8c8a6; }
      #pp-guide textarea { width: 100%; resize: vertical; min-height: 52px; max-height: 160px; padding: 8px 10px; font: 13px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif; color: #eae2d4; background: rgba(10, 10, 12, 0.88); border: 1px solid rgba(216, 200, 166, 0.45); border-radius: 2px; outline: none; }
      #pp-guide textarea:focus { border-color: #d8c8a6; background: rgba(20, 18, 16, 0.94); }
      #pp-guide textarea::placeholder { color: #6f6a61; }
      #pp-strip { display: flex; gap: 4px; margin-top: 8px; height: 36px; }
      #pp-strip canvas { width: 36px; height: 36px; border: 1px solid var(--line); display: block; }
      #pp-status { margin-top: 8px; font-size: 10px; color: #b9ad97; line-height: 1.4; }
      #clip-link { left: 50%; bottom: 140px; transform: translateX(-50%); pointer-events: auto; background: rgba(20, 18, 16, 0.94); border: 1px solid rgba(232, 220, 200, 0.35); color: #eae2d4; padding: 12px 18px; font-size: 12px; text-decoration: none; letter-spacing: 0.3px; }
      #clip-link:hover { border-color: #d8c8a6; }
      #clip-link[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="viewport"></div>
    <div id="title" class="chrome"><h1>Venus Veil</h1><p>A form held by air</p><div id="activity" role="status" aria-live="off" data-status="loading">connexion…</div></div>
    <div id="progress" class="chrome"><div id="progress-label">loading depth model…</div><div id="progress-track"><div id="progress-bar"></div></div></div>
    <div id="thumbs" class="chrome" hidden><canvas id="thumb-photo" width="144" height="144" title="photo"></canvas><canvas id="thumb-depth" width="144" height="144" title="depth"></canvas><canvas id="thumb-mask" width="144" height="144" title="mask"></canvas></div>
    <div id="projector-panel" class="chrome" hidden>
      <div class="pp-row">
        <figure><canvas id="pp-depth" width="256" height="256"></canvas><figcaption>veil depth · projector view</figcaption></figure>
        <figure><canvas id="pp-output" width="256" height="256"></canvas><figcaption id="pp-output-label">output</figcaption></figure>
      </div>
      <label id="pp-guide"><span>guide the image <b id="pp-guide-state"></b></span><textarea id="pp-guide-input" rows="2" maxlength="200" spellcheck="false" placeholder="e.g. smiling, eyes closed, gold leaf"></textarea></label>
      <div id="pp-strip"></div>
      <div id="pp-status">projector offline</div>
    </div>
    <div id="footer" class="chrome">
      <span id="drop-hint">Drop a sculpture photo anywhere<i>·</i>drag to orbit<i>·</i>move the pointer through the veil to push it</span>
      <span><span id="state">live</span><i>·</i><span id="fps">— fps</span></span>
    </div>
    <div id="drop-overlay">release to weave the sculpture into the veil</div>
    <a id="clip-link" class="chrome" hidden download></a>
    <div id="toast" class="chrome"></div>
    <div id="loading"><span>venus veil</span></div>
    <div id="error" hidden><h1>The studio could not start.</h1><p></p></div>
    <input id="file-input" type="file" accept="image/png,image/jpeg,image/webp" />
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
