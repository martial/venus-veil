  <body>
    <div id="viewport"></div>
    <div id="title" class="chrome"><h1>Venus Veil</h1><p>A form held by air</p></div>
    <div id="progress" class="chrome"><div id="progress-label">loading depth model…</div><div id="progress-track"><div id="progress-bar"></div></div></div>
    <div id="thumbs" class="chrome" hidden><canvas id="thumb-photo" width="144" height="144" title="photo"></canvas><canvas id="thumb-depth" width="144" height="144" title="depth"></canvas><canvas id="thumb-mask" width="144" height="144" title="mask"></canvas></div>
    <div id="projector-panel" class="chrome" hidden>
      <div class="pp-row">
        <figure><canvas id="pp-depth" width="256" height="256"></canvas><figcaption>veil depth · projector view</figcaption></figure>
        <figure><canvas id="pp-output" width="256" height="256"></canvas><figcaption id="pp-output-label">output</figcaption></figure>
      </div>
      <div id="pp-strip"></div>
      <div id="pp-status">projector offline</div>
    </div>
    <div id="footer" class="chrome">
      <span id="drop-hint">Drop a sculpture photo anywhere<i>·</i>drag to orbit<i>·</i>move the pointer through the veil to push it</span>
      <span><span id="state">live</span><i>·</i><span id="fps">— fps</span></span>
    </div>
    <div id="drop-overlay">release to weave the sculpture into the veil</div>
    <a id="clip-link" class="chrome" hidden download></a>
    <div id="toast" class="chrome"></div>
    <div id="loading"><span>venus veil</span></div>
    <div id="error" hidden><h1>The studio could not start.</h1><p></p></div>
    <input id="file-input" type="file" accept="image/png,image/jpeg,image/webp" />
